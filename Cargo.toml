[package]
name = "dmidiplayer"
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
description = "Cross-platform MIDI and karaoke player built with Rust and Dioxus Desktop"
repository = "https://github.com/goshitsarch-eng/goshmidi"

[workspace]

[features]
default = ["desktop"]
ui-test = ["desktop"]
desktop = ["dep:dioxus", "dep:rfd", "dep:arboard", "dep:opener", "dep:tokio", "dep:gtk", "dep:image"]

[[bin]]
name = "dmidiplayer"
path = "src/main.rs"

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["lib", "desktop"], optional = true }
midir = "0.11"
libloading = "0.9"
directories = "6"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
rfd = { version = "0.17", optional = true }
arboard = { version = "3", default-features = false, optional = true }
opener = { version = "0.8", features = ["reveal"], optional = true }
tokio = { version = "1", features = ["time", "rt", "sync"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
futures-util = "0.3"
chardetng = "1"
encoding_rs = "0.8"
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"
gtk = { version = "0.18", optional = true }

[profile.dev]
debug = 1
