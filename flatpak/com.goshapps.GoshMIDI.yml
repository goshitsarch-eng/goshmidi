# Dioxus Linux host uses WebKitGTK 4.1 and libxdo.
# File access uses portals; --device=all retains ALSA sequencer access.
app-id: com.goshapps.GoshMIDI
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
- org.freedesktop.Sdk.Extension.rust-stable
command: dmidiplayer
finish-args:
- --share=ipc
# Dioxus streams authenticated edits over localhost. WebKit's nested Flatpak
# helpers need the shared network namespace to reach that loopback listener.
- --share=network
- --socket=fallback-x11
- --socket=wayland
- --device=dri
- --socket=pulseaudio
- --device=all
modules:
- name: libxdo
  buildsystem: simple
  build-commands:
  - make libxdo.so
  - install -Dm755 libxdo.so /app/lib/libxdo.so.3
  - ln -s libxdo.so.3 /app/lib/libxdo.so
  - install -Dm644 COPYRIGHT /app/share/licenses/libxdo/COPYRIGHT
  sources:
  - type: archive
    url: https://codeload.github.com/jordansissel/xdotool/tar.gz/f11c44edd4d426d69bcff479b0d643a4da8bc99b
    archive-type: tar-gzip
    sha256: 48112e7fdddd7bfa66e0b221eb4f1a1602dfefe079d83f072b62953299665641
- name: fluidsynth
  buildsystem: cmake-ninja
  config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -Denable-signalsmith=OFF
  sources:
  - type: archive
    url: https://github.com/FluidSynth/fluidsynth/archive/refs/tags/v2.6.0.tar.gz
    sha256: 6d17570ea2086dd6fbcac995465773a6f316e689089b7fb7ba0b34c2ec6f680d
  - type: archive
    url: https://github.com/kthohr/gcem/archive/012ae73c6d0a2cb09ffe86475f5c6fba3926e200.tar.gz
    sha256: 34ab0ee87a9eb26d3087fa9b49c2572ea8ee03db0c9705b83648301a3a3fc172
    dest: gcem
  cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/doc
  - /share/man
  post-install:
  - install -Dm644 LICENSE /app/share/licenses/fluidsynth/LICENSE
- name: soundfont
  buildsystem: simple
  build-commands:
  - install -Dm644 FluidR3Mono_GM.sf3 /app/share/soundfonts/FluidR3Mono_GM.sf3
  - install -Dm644 FluidR3Mono_License.md /app/share/soundfonts/FluidR3Mono_License.md
  sources:
  - type: file
    url: https://raw.githubusercontent.com/LibreScore/sf3/3a6eda823dac2ec3e134d38544ca839217358f08/FluidR3Mono_GM.sf3.wasm
    sha256: cfcd66d89e8386823400eca64934b14fbea7bf48ba1f00d21189af1262794ec2
    dest-filename: FluidR3Mono_GM.sf3
  - type: file
    url: https://raw.githubusercontent.com/LibreScore/sf3/3a6eda823dac2ec3e134d38544ca839217358f08/FluidR3Mono_License.md
    sha256: c21ed6be2fea862673953977c616befc28d1b20dfa60349e4461b97c759db6ca
    dest-filename: FluidR3Mono_License.md
- name: dmidiplayer
  buildsystem: simple
  build-options:
    append-path: /usr/lib/sdk/rust-stable/bin
    env:
      CARGO_HOME: /run/build/dmidiplayer/cargo
      CARGO_NET_OFFLINE: 'true'
      RUSTFLAGS: -L /app/lib
  build-commands:
  - cargo --offline fetch --locked --manifest-path Cargo.toml
  - cargo --offline build --release --locked
  - cargo --offline test --no-default-features --locked
  - python3 scripts/package-native.py --licenses-only /app/share/licenses/dmidiplayer/rust
  - install -Dm755 target/release/dmidiplayer /app/bin/dmidiplayer
  - install -Dm644 LICENSE /app/share/licenses/dmidiplayer/LICENSE
  - install -Dm644 THIRD_PARTY_NOTICES.md /app/share/licenses/dmidiplayer/THIRD_PARTY_NOTICES.md
  - install -Dm644 examples/README.md /app/share/dmidiplayer/README.md
  - install -Dm644 com.goshapps.GoshMIDI.desktop /app/share/applications/com.goshapps.GoshMIDI.desktop
  - install -Dm644 com.goshapps.GoshMIDI.metainfo.xml /app/share/metainfo/com.goshapps.GoshMIDI.metainfo.xml
  - install -Dm644 docs/dmidiplayer.1 /app/share/man/man1/dmidiplayer.1
  - for s in 24x24 32x32 48x48 64x64 128x128; do install -Dm644 icons/dmidiplayer_$s.png /app/share/icons/hicolor/$s/apps/com.goshapps.GoshMIDI.png;
    done
  - install -Dm644 icons/dmidiplayer.svgz /app/share/icons/hicolor/scalable/apps/com.goshapps.GoshMIDI.svgz
  - mkdir -p /app/share/dmidiplayer && (cd examples && for f in *.kar *.mid; do [ -e "$f" ] || continue; printf
    '%s\n' "$f"; done > /app/share/dmidiplayer/examples.lst) && for f in examples/*.mid examples/*.kar; do [ -e
    "$f" ] || continue; install -m644 "$f" /app/share/dmidiplayer/; done
  sources:
  - type: dir
    path: ..
    skip:
    - target
    - build
    - build-dir
    - .flatpak-builder
    - .git
    - dist
    - packaging/resources
    - qa-build
    - flatpak-repo
    - qa-repo
  - cargo-sources.json
